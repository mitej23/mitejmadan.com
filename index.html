<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Runs before first paint, so the theme never flashes and `.reveal` never
         hides content on a browser that won't be running our JS. -->
    <script>
      (function () {
        var el = document.documentElement;
        el.classList.add("js");
        try {
          var s = localStorage.getItem("theme");
          el.dataset.theme =
            s === "dark" || s === "light"
              ? s
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
        } catch (e) {
          el.dataset.theme = "light";
        }
      })();
    </script>

    <title>Mitej Madan · Full Stack Engineer</title>
    <meta
      name="description"
      content="Full stack engineer at TheAgentic, Mumbai. I build agent infrastructure and the interfaces that make it usable — TypeScript, React, Python, Postgres."
    />
    <link rel="canonical" href="https://mitejmadan.com/" />
    <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0b0a" media="(prefers-color-scheme: dark)" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
